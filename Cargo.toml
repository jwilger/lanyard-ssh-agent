[package]
name = "lanyard-ssh-agent"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "A resilient switching proxy for SSH agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jwilger/lanyard-ssh-agent"
homepage = "https://jwilger.github.io/lanyard-ssh-agent/"
documentation = "https://docs.rs/lanyard-ssh-agent"
readme = "README.md"
include = ["/src/**", "/CHANGELOG.md", "/README.md", "/LICENSE-*"]
keywords = ["ssh", "agent", "git", "signing", "proxy"]
categories = ["command-line-utilities", "authentication"]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Checksums to generate for each App
checksum = "sha256"
# The generated workflow has intentional shellcheck hardening beyond dist's
# template; keep it instead of silently overwriting those changes.
allow-dirty = ["ci"]

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "df4cb1c069e1874edd31b4311f1884172cec0e10"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
assert_cmd = "2"
mutants = "0.0.4"
predicates = "3"
serde_yaml = "0.9"
tempfile = "3.27.0"
toml = "0.9"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
# These restriction lints conflict with idiomatic application code or with the
# other enabled lint groups; each relaxation is intentionally explicit.
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
inline_modules = "allow"
missing_docs_in_private_items = "allow"
question_mark_used = "allow"
self_named_module_files = "allow"
single_call_fn = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
tests_outside_test_module = "allow"
arbitrary_source_item_ordering = "allow"
big_endian_bytes = "allow"
integer_division_remainder_used = "allow"
panic_in_result_fn = "allow"
print_stdout = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
